<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse 55% 22% at 50% 0,#dfece4,transparent),var(--bg);color:var(--ink);overscroll-behavior:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.32;cursor:default}.app{width:100%;max-width:480px;margin:auto;padding:10px 6px calc(10px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}

.stats{display:flex;justify-content:space-between;align-items:center;margin:0 13px 7px;gap:6px}.stat{display:flex;align-items:baseline;gap:6px}.stat .label{font-size:10px;letter-spacing:.1em;color:#92a29b;font-weight:780}.stat b{font-size:20px;font-weight:830;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.stat.mini b{font-size:16px}.session{font-size:9px;font-weight:720;color:#8aa199;letter-spacing:.02em;text-align:right;white-space:nowrap}
.board-shell{width:var(--board-width);margin:auto;padding:5px;border-radius:14px;background:#f9fbf6;border:1px solid #d6e3d8;box-shadow:0 8px 25px #274e3912}.board{position:relative;aspect-ratio:6/8;width:100%;border-radius:10px;overflow:hidden;touch-action:none;cursor:crosshair;border:1px solid #233e40;background:radial-gradient(ellipse 90% 70% at 45% 11%,#28484b,#1b353b 68%,#162b31)}.slots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr)}.slot{margin:2px;border:1px solid #8aaea81c;border-radius:7px;background:#91bdb409}.lane{position:absolute;top:0;bottom:0;width:16.6667%;left:0;background:linear-gradient(180deg,#a5e9c519,#84d5b407 75%,#5ac5a213);border-left:1px solid #c0ebce24;border-right:1px solid #c0ebce24;transition:transform .075s ease;pointer-events:none}.ghost{position:absolute;width:16.6667%;height:12.5%;border-radius:8px;padding:2px;opacity:.65;pointer-events:none;transition:left .075s,top .075s}.ghost div{border:1px dashed #9ce9c9;border-radius:8px;width:100%;height:100%;background:#b3f4d71c}.tile-layer{position:absolute;inset:0;pointer-events:none}.tile{position:absolute;width:16.6667%;height:12.5%;padding:2.5px;transform:translateZ(0);will-change:top,left;transition:top .24s cubic-bezier(.16,.83,.27,1),left .13s ease;pointer-events:none}.tile-face{display:flex;align-items:center;justify-content:center;height:100%;width:100%;border:1px solid #f0f3eb;border-radius:8px;background:linear-gradient(155deg,#fffffc 0%,#f9faf4 64%,#e8f0e6);box-shadow:0 2.5px 0 #92aea3,0 5px 9px #081d2040,inset 0 1px 0 white}.tile-digit{color:#213d41;letter-spacing:-.065em;font-size:clamp(20px,6.8vw,32px);font-weight:800;font-variant-numeric:lining-nums tabular-nums;line-height:1}.tile.warm .tile-face{background:linear-gradient(152deg,#fffefa,#e9f8ed);border-color:#b7e4cd}.tile.warm .tile-digit{color:#0f8279}.tile.blink .tile-face{animation:pop .23s cubic-bezier(.25,.85,.3,1.15)}.tile.vanish .tile-face{animation:vanish .18s ease forwards}@keyframes pop{0%{transform:scale(.82);filter:brightness(1.16)}70%{transform:scale(1.045)}100%{transform:scale(1)}}@keyframes vanish{to{opacity:0;transform:scale(.72)}}.active{z-index:4;transition:left .08s ease,top .065s linear}.active .tile-face{background:linear-gradient(150deg,#fffefa,#e6f5e8);border-color:#8ed8ba;box-shadow:0 3px 0 #5aab99,0 7px 13px #071e2345}.active .tile-digit{color:#097d73}.reaction{position:absolute;border:2px solid #7be4ba;box-shadow:0 0 0 3px #7be4ba24;pointer-events:none;border-radius:8px;z-index:5;animation:react .19s ease-out}@keyframes react{from{opacity:.6;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.guide{min-height:28px;display:flex;align-items:center;gap:8px;margin:6px 10px 1px;font-size:11px;font-weight:700;color:#53716c}.guide .stem{width:5px;height:5px;border-radius:50%;background:#13a89c;flex:none}.guide strong{color:#157d76}.queue{display:flex;align-items:center;gap:7px;margin:4px 10px 8px;min-height:45px}.smalllabel{font-size:9px;color:#829a8f;font-weight:800;letter-spacing:.09em;margin-right:5px}.next{min-width:40px;height:40px;padding:0 7px;border-radius:10px;background:#fffefa;border:1px solid #e0e8df;display:grid;place-items:center;font-size:19px;letter-spacing:-.04em;font-weight:790;color:#294648}.next:first-of-type{background:#e6f5eb;border-color:#9dcebf}.queue .push{margin-left:auto}.tiny{font-size:10px;font-weight:720;color:#829a8f}.controls{display:grid;grid-template-columns:57px 1fr 57px;gap:8px;margin:0 8px}.ctrl{height:53px;border-radius:14px;border:1px solid #d5e4da;color:#4b7470;background:#fffefa;box-shadow:0 3px 0 #d0ded5;font-weight:900;font-size:23px}.ctrl:active{transform:translateY(2px);box-shadow:0 1px 0 #d0ded5}.ctrl.drop{background:#0c9c91;color:white;border-color:#08796f;box-shadow:0 4px 0 #08766c;font-size:14px;letter-spacing:.1em}.ctrl.drop:active{box-shadow:0 1px 0 #08766c}.sub{display:flex;align-items:center;justify-content:space-between;padding:7px 13px 0;color:#899c95}.sub button{background:none;border:0;padding:6px 2px;color:#6d8880;font-size:11px;font-weight:740}.sub button:active{color:#0b8379}.sub span{font-size:9px;color:#a1aaa4}
.overlay{position:fixed;inset:0;background:#142e33bd;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.overlay.open{display:flex}.dialog{background:#fffefa;padding:25px 21px 18px;border-radius:22px;width:min(100%,370px);text-align:center;box-shadow:0 15px 60px #071b1e45}.dialog h2{font-size:22px;margin:0 0 7px}.dialog p{font-size:13px;color:#58766f;line-height:1.75;margin:0 0 17px}.dialog .actions{display:flex;gap:8px}.dialog button{flex:1;padding:13px 6px;border-radius:12px;border:1px solid #d6e5dc;background:#f0f5f0;color:#375a56;font-weight:820}.dialog .primary{background:#0d948a;color:white;border-color:#0d948a}
@media(min-width:700px){.app{max-width:460px}.board-shell{width:min(100%,420px)}}@media(max-height:780px){.app{padding-top:6px}.board-shell{width:min(calc(100vw - 12px),calc((100dvh - 264px)*.75),420px)}.modes{margin-top:4px;margin-bottom:6px}.stats{margin-bottom:4px}.queue{margin-bottom:5px}.guide{margin-top:4px}}@media(max-height:650px){.board-shell{width:min(calc(100vw - 12px),calc((100dvh - 233px)*.75),420px)}header{height:33px}.ctrl{height:46px}.mode{height:36px}.queue{min-height:38px}.next{height:34px;min-width:34px}.sub{padding-top:3px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<main class="app">
<header><div><span class="eyebrow">THE NUMBER LAB</span><h1>FACTOR <span>DROP</span></h1></div><div class="iconbar"><button class="iconbtn" id="sound" aria-label="音のオン・オフ">♫</button><button class="iconbtn" id="help" aria-label="遊び方">?</button></div></header>
<div class="modes" role="group" aria-label="割り方の比較"><button class="mode selected" data-mode="gcd">一気に割る<small>最大公約数</small></button><button class="mode" data-mode="prime">1個ずつ割る<small>共通する素因数</small></button></div>
<section class="stats"><div class="stat"><span class="label">SCORE</span><b id="score">000</b></div><div class="stat mini"><span class="label">SURVIVED</span><b id="turns">0</b></div><div class="session">SAME BOARD · SAME ORDER</div></section>
<div class="board-shell"><div class="board" id="board" role="application" aria-label="6列8段の数字ブロック。指で左右に動かし、指を離すと落とせる"><div class="slots" id="slots"></div><div class="lane" id="lane"></div><div class="ghost" id="ghost"><div></div></div><div class="tile-layer" id="tileLayer"></div><div class="tile-layer" id="fxLayer"></div></div></div>
<div class="guide" aria-live="polite"><span class="stem"></span><span id="guide">まずは <strong>7</strong> を <strong>14</strong> に落としてみよう</span></div>
<div class="queue"><span class="smalllabel">NEXT</span><div class="next" id="n1">7</div><div class="next" id="n2">5</div><div class="next" id="n3">3</div><span class="push tiny">先の3個が見える</span></div>
<div class="controls"><button class="ctrl" id="left" aria-label="左へ">‹</button><button class="ctrl drop" id="drop">すぐ落とす</button><button class="ctrl" id="right" aria-label="右へ">›</button></div>
<div class="sub"><button id="restart">↻ 同じ順番でやり直す</button><span>HOLDなし・自動落下</span><button id="undo">↶ 一手戻す</button></div>
</main>
<div class="overlay" id="overlay" aria-hidden="true"><div class="dialog"><h2 id="dialogTitle">あそびかた</h2><p id="dialogText"></p><div class="actions"><button id="dialogAlt">閉じる</button><button class="primary" id="dialogMain">遊ぶ</button></div></div></div>
<script>
(()=>{'use strict';
const W=6,H=8,$=id=>document.getElementById(id),gcd=(a,b)=>{while(b)[a,b]=[b,a%b];return a;};
const primeFactor=n=>{for(let p=2;p*p<=n;p++)if(n%p===0)return p;return n;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const modeButtons=[...document.querySelectorAll('.mode')];
const board=$('board'),layer=$('tileLayer'),fx=$('fxLayer'),ghost=$('ghost'),lane=$('lane'),guide=$('guide');
const seedCols=()=>[[14],[9],[25,18],[8],[21],[10]];
const scripted=[7,12,5,3,6,11,14,9,10,21,15,22,18,13,35,42,12,33,49,25,30,26,45,7,6];
const balanced=[6,9,10,12,14,15,18,20,21,22,25,26,27,28,30,33,35,39,42,45,49,55,63,65,66,70,77,78,91,99,2,3,5,7,11,13];
const FIXED_SEED=0x31ced21;
let rng=FIXED_SEED,cols=[],queue=[],mode='gcd',score=0,turns=0,activeCol=0,activeY=0,busy=false,ended=false,paused=false,soundOn=true,generation=0,history=[],lastTS=0;
let audioCtx=null,grain=null,lastMove=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastBoard=[];
const nextRand=()=>{rng=(Math.imul(1664525,rng)+1013904223)>>>0;return rng/4294967296};
function refill(){while(queue.length<4)queue.push(balanced[Math.floor(nextRand()*balanced.length)]);}
function tone(f,d,g=.1,kind='triangle'){if(!soundOn)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),v=audioCtx.createGain(),t=audioCtx.currentTime;o.type=kind;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(60,f*.62),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.004);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audioCtx.destination);o.start(t);o.stop(t+d+.01);}catch(e){}}
function sound(kind,k=1){if(kind==='tick'){if(performance.now()-lastMove<55)return;lastMove=performance.now();tone(740,.03,.027,'triangle')}else if(kind==='land')tone(220,.065,.055,'sine');else if(kind==='cut')tone(520+Math.min(k,6)*38,.115,.056,'triangle');else if(kind==='clear')tone(680,.13,.06,'sine')}
function setGuide(t){guide.innerHTML=t}
function tileHTML(n){return `<div class="tile-face"><span class="tile-digit">${n}</span></div>`}
function reset(){generation++;paused=false;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');cols=seedCols();queue=scripted.slice();rng=FIXED_SEED;refill();score=0;turns=0;activeCol=0;activeY=0;busy=false;ended=false;history=[];lastTS=performance.now();lastBoard=[];setGuide('まずは <strong>7</strong> を <strong>14</strong> に落としてみよう');paint();}
function snapshot(){return {cols:cols.map(a=>a.slice()),queue:queue.slice(),rng,score,turns,activeCol}}
function restore(s){generation++;paused=false;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');cols=s.cols.map(a=>a.slice());queue=s.queue.slice();rng=s.rng;score=s.score;turns=s.turns;activeCol=s.activeCol;activeY=0;busy=false;ended=false;setGuide('同じ局面に戻したよ');lastBoard=[];paint()}
function front(){return queue[0]||7}
function at(c,y){return cols[c]?.[y]||0}
function pairs(){const list=[];for(let y=0;y<H;y++)for(let c=0;c<W;c++){const a=at(c,y);if(!a)continue;for(const [dc,dy] of [[0,1],[1,0]]){const cc=c+dc,yy=y+dy,b=at(cc,yy);if(b&&gcd(a,b)>1)list.push({c,y,cc,yy,g:gcd(a,b),a,b})}}return list}
function nearest(list,centers){const distance=p=>Math.min(...centers.map(([c,y])=>Math.min(Math.abs(p.c-c)+Math.abs(p.y-y),Math.abs(p.cc-c)+Math.abs(p.yy-y))));list.sort((a,b)=>distance(a)-distance(b)||a.y-b.y||a.c-b.c||a.yy-b.yy||a.cc-b.cc);return list[0]}
function paint(blink=[]){const html=[];for(let c=0;c<W;c++)for(let y=0;y<cols[c].length;y++){const n=cols[c][y],key=c+':'+y,changed=blink.some(a=>a[0]===c&&a[1]===y);html.push(`<div class="tile ${changed?'blink warm':''}" style="left:${c/W*100}%;top:${(H-1-y)/H*100}%" data-pos="${key}">${tileHTML(n)}</div>`)}layer.innerHTML=html.join('');$('score').textContent=String(score).padStart(3,'0');$('turns').textContent=turns;[$('n1'),$('n2'),$('n3')].forEach((el,i)=>el.textContent=queue[i]??'');$('undo').disabled=busy||!history.length;$('drop').disabled=busy||ended;$('left').disabled=busy||ended;$('right').disabled=busy||ended;moveActive()}
function moveActive(){lane.style.transform=`translateX(${activeCol*100}%)`;ghost.style.left=(activeCol/W*100)+'%';const maxY=H-cols[activeCol].length-1;ghost.style.top=(Math.max(0,maxY)/H*100)+'%';ghost.style.opacity=(busy||ended||maxY<0)?'0':'.72';if(busy||ended){fx.querySelector('.active')?.remove();return;}let active=fx.querySelector('.active');if(!active){active=document.createElement('div');active.className='tile active';fx.appendChild(active)}active.innerHTML=tileHTML(front());active.style.left=activeCol/W*100+'%';active.style.top=Math.max(0,Math.min(activeY,maxY))/H*100+'%'}
function setCol(col){if(busy||ended)return;const next=Math.max(0,Math.min(W-1,col));if(next!==activeCol){activeCol=next;sound('tick');moveActive()}}
function highlightPair(p){fx.querySelectorAll('.reaction').forEach(x=>x.remove());for(const [c,y] of [[p.c,p.y],[p.cc,p.yy]]){const d=document.createElement('div');d.className='reaction';d.style.left=(c/W*100)+'%';d.style.top=((H-1-y)/H*100)+'%';d.style.width=(100/W)+'%';d.style.height=(100/H)+'%';fx.appendChild(d)}}
async function stabilize(gen,center){let chain=0,last=center,guard=0;while(guard++<140){const list=pairs();if(!list.length)break;const p=nearest(list,[last]);const d=mode==='gcd'?p.g:primeFactor(p.g);highlightPair(p);sound('cut',chain+1);await wait(reduced?2:115);if(gen!==generation)return -1;
 // Both numbers divide by the same factor. 1 disappears. Gravity closes every gap.
 const v1=p.a/d,v2=p.b/d;
 cols[p.c][p.y]=v1;cols[p.cc][p.yy]=v2;
 for(let c=0;c<W;c++)cols[c]=cols[c].filter(n=>n>1);
 chain++;score+=(v1===1?40:0)+(v2===1?40:0);
 last=[p.c,Math.min(p.y,Math.max(0,cols[p.c].length-1))];
 setGuide(`<strong>${p.a}</strong> と <strong>${p.b}</strong> を ${d} で割る → <strong>${v1}</strong> と <strong>${v2}</strong>${chain>1?`　・　${chain}連鎖`:''}`);paint([[p.c,Math.min(p.y,Math.max(0,cols[p.c].length-1))],[p.cc,Math.min(p.yy,Math.max(0,cols[p.cc].length-1))]]);
 await wait(reduced?2:mode==='prime'?175:230);if(gen!==generation)return -1;
 }
 fx.querySelectorAll('.reaction').forEach(x=>x.remove());if(chain>1)sound('clear');return chain}
async function drop(col){if(busy||ended||paused)return;col=Math.max(0,Math.min(W-1,col));if(cols[col].length>=H){setGuide('この列はいっぱい。別の列を選ぼう');return}const gen=generation;busy=true;history.push(snapshot());if(history.length>45)history.shift();const n=queue.shift();refill();activeCol=col;activeY=0;fx.querySelector('.active')?.remove();const falling=document.createElement('div');falling.className='tile active';falling.innerHTML=tileHTML(n);falling.style.left=col/W*100+'%';falling.style.top='0%';fx.appendChild(falling);const target=H-cols[col].length-1,travel=Math.min(410,170+target*24);
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>{falling.style.transition=`top ${reduced?1:travel}ms cubic-bezier(.25,.73,.3,1)`;falling.style.top=target/H*100+'%';setTimeout(resolve,reduced?3:travel+22)})));
 if(gen!==generation){falling.remove();return}falling.remove();sound('land');cols[col].push(n);paint([[col,cols[col].length-1]]);await wait(reduced?1:65);if(gen!==generation)return;const chain=await stabilize(gen,[col,cols[col].length-1]);if(gen!==generation)return;turns++;score+=5;activeY=0;busy=false;if(cols.some(a=>a.length>=H)){ended=true;paint();setGuide('盤面がいっぱい！ よく生き残ったね');setTimeout(()=>{if(gen===generation&&ended)showDialog('GAME OVER',`${turns}手 生き残ったよ。<br>スコア：${score}`,'盤面を見る','もう一度',()=>{},()=>reset())},300)}else{if(chain===0)setGuide('共通因数がないので、そのまま積み上がった');else if(turns===1)setGuide('次の <strong>12</strong> を <strong>18</strong> に落としてみよう。割り方の違いが見える');else if(chain>1)setGuide(`<strong>${chain}連鎖！</strong> 次はもっと大きな連鎖を狙おう`);else setGuide('いい約分！ 次の数字も見てみよう');paint()}}
function showDialog(title,body,alt,main,onAlt,onMain){paused=true;$('dialogTitle').textContent=title;$('dialogText').innerHTML=body;$('dialogAlt').textContent=alt;$('dialogMain').textContent=main;$('overlay').classList.add('open');$('overlay').setAttribute('aria-hidden','false');$('dialogAlt').onclick=()=>{closeDialog();onAlt?.()};$('dialogMain').onclick=()=>{closeDialog();onMain?.()}}
function closeDialog(){paused=false;$('overlay').classList.remove('open');$('overlay').setAttribute('aria-hidden','true');lastTS=performance.now()}
function swapMode(next){if(mode===next)return;const act=()=>{mode=next;modeButtons.forEach(b=>b.classList.toggle('selected',b.dataset.mode===mode));reset();setGuide(mode==='prime'?'共通素因数を1個ずつ取り除く。途中の数字も連鎖する':'最大公約数で一度に割る。同じ数字順で比較できる')};if(turns>0)showDialog('割り方を変更する？','同じ初期盤面と同じ出現順で、最初から比較できるよ。','戻る','切り替える',null,act);else act()}
function toggleSound(){soundOn=!soundOn;$('sound').textContent=soundOn?'♫':'♪̸';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)sound('tick')}
function loop(ts){if(!lastTS)lastTS=ts;const dt=Math.min(.055,Math.max(0,(ts-lastTS)/1000));lastTS=ts;if(!paused&&!busy&&!ended&&!document.hidden){activeY+=(.67+Math.min(.75,turns*.025))*dt;const target=H-1-cols[activeCol].length;if(activeY>=target){activeY=target;drop(activeCol)}else moveActive()}requestAnimationFrame(loop)}
$('slots').innerHTML='<div class="slot"></div>'.repeat(W*H);$('left').onclick=()=>setCol(activeCol-1);$('right').onclick=()=>setCol(activeCol+1);$('drop').onclick=()=>drop(activeCol);$('undo').onclick=()=>{if(busy||!history.length)return;restore(history.pop());sound('tick')};$('restart').onclick=()=>{if(!turns){reset();return}showDialog('同じ順番でやり直す？','数字の出現順を変えず、最初の盤面に戻るよ。','続ける','やり直す',null,reset)};
$('sound').onclick=toggleSound;$('sound').setAttribute('aria-pressed','true');$('help').onclick=()=>showDialog('遊び方','数字を左右に動かし、<strong>指を離して落とす</strong>。<br>縦でも横でも共通因数があれば必ず反応し、<strong>両方が同じ数で割られる</strong>。<br>1になったブロックは消え、上のブロックが落ちる。反応がなくなるまで続くよ。<br><br><strong>一気に割る：</strong>最大公約数で割る。<br><strong>1個ずつ割る：</strong>共通する最小の素因数を1個ずつ取り除く。途中で別の隣とも連鎖できる。<br><br>両モードの初期盤面と数字の出現順は同じ。','閉じる','遊ぶ');modeButtons.forEach(b=>b.onclick=()=>swapMode(b.dataset.mode));
let pointer=null;board.addEventListener('pointerdown',e=>{if(busy||ended||paused)return;pointer=e.pointerId;board.setPointerCapture?.(e.pointerId);const r=board.getBoundingClientRect();setCol(Math.floor((e.clientX-r.left)/r.width*W))});board.addEventListener('pointermove',e=>{if(e.pointerId!==pointer)return;const r=board.getBoundingClientRect();setCol(Math.floor((e.clientX-r.left)/r.width*W))});board.addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;pointer=null;drop(activeCol)});board.addEventListener('pointercancel',()=>{pointer=null});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();setCol(activeCol-1)}else if(e.key==='ArrowRight'){e.preventDefault();setCol(activeCol+1)}else if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();drop(activeCol)}});document.addEventListener('visibilitychange',()=>{lastTS=performance.now()});
reset();requestAnimationFrame(loop);
