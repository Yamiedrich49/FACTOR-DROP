<!doctype html>
<html lang="ja">

<style>
:root{--ink:#173a3b;--muted:#829b95;--bg:#f3f5f0;--teal:#00a69b;--edge:#dce8df;--surface:#fffef9;--dark:#112e32;--tile:#fffef7;--ease:cubic-bezier(.17,.84,.28,1);--p:#008f85}
*{box-sizing:border-box}html{-webkit-tap-highlight-color:transparent;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}body{background:var(--bg);margin:0;min-height:100dvh;color:var(--ink);overflow-x:hidden}button{font-family:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}button:focus-visible{outline:3px solid #0bbbad;outline-offset:2px}.app{width:min(100%,520px);margin:auto;padding:16px 10px max(15px,env(safe-area-inset-bottom));}
.head{display:flex;align-items:flex-start;justify-content:space-between;padding:7px 6px 0}.brand small{display:block;letter-spacing:.25em;font-weight:850;font-size:9px;color:#79928c;margin:0 0 2px}.brand h1{margin:0;font-size:clamp(25px,7.3vw,36px);font-weight:850;letter-spacing:-.06em;line-height:1.04}.brand h1 em{font-style:normal;color:var(--teal)}.head-actions{display:flex;gap:6px}.round{height:38px;width:38px;background:#fffefa;border:1px solid #dfebe2;color:#638982;border-radius:12px;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 0 #d7e5da}.round:active{transform:translateY(2px);box-shadow:none}.stage-line{display:flex;justify-content:space-between;align-items:baseline;padding:16px 5px 8px}.stage-label{font-size:11px;color:#647f79;font-weight:750;letter-spacing:.045em}.stage-label b{font-size:13px;color:var(--ink)}.stage-progress{display:flex;gap:4px;margin-top:9px;padding:0 5px}.progress-dot{height:4px;flex:1;border-radius:6px;background:#d9e5de}.progress-dot.done{background:#6bc8b7}.progress-dot.active{background:#02a99b}.task{font-size:19px;font-weight:850;letter-spacing:-.045em}.task small{font-size:11px;color:#7c968c;font-weight:750;margin-left:6px}.stats{display:flex;gap:8px;font-size:12px;color:#708a83}.stats strong{font-size:15px;color:var(--ink);font-weight:850}.instruction{height:43px;display:flex;align-items:center;padding:0 9px;font-size:13px;color:#748f87;justify-content:center;transition:color .15s;font-weight:650}.instruction b{color:#169e92}.instruction.pop{color:var(--teal)}
.arena-card{background:linear-gradient(150deg,#fbfcf7,#f1f5ee);border:1px solid #e0e9df;border-radius:26px;padding:12px 10px 13px;box-shadow:0 8px 24px #29483b0a}.arena{display:grid;grid-template-columns:42px minmax(0,1fr);grid-template-rows:40px auto;gap:2px;width:100%}.corner{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9eafa8}.col-aim{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(5,1fr);gap:0}.row-aim{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(5,1fr);gap:0}.aim{display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#afc9bb;font-size:22px;border-radius:8px;transition:background .12s,color .12s,transform .12s}.aim:active{transform:scale(.88);background:#dbeee6;color:#059f93}.aim:hover{color:#10aa99}.aim:disabled{opacity:.25}.board{grid-column:2;grid-row:2;position:relative;aspect-ratio:1/1;border:1px solid #375556;border-radius:13px;background:radial-gradient(ellipse at 50% 30%,#244c4d,#193a40 67%,#142c34);box-shadow:inset 0 6px 17px #091e2538,inset 0 0 0 2px #63857c14;overflow:hidden;isolation:isolate}.cells{position:absolute;inset:4px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:4px;z-index:2}.cell{position:relative;display:flex;justify-content:center;align-items:center;border-radius:9px;border:1px solid #ffffff0d;background:#ffffff08;min-width:0;min-height:0;transition:background .15s}.cell.occupied{background:linear-gradient(155deg,#fffffc,#f8faf4 75%,#ecf2e9);box-shadow:0 3px 0 #7fa498,0 5px 9px #001d273b,inset 0 1px 0 #fff;border-color:#e2eae0}.cell .number{position:relative;z-index:1;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;font-size:clamp(18px,5.4vw,30px);font-weight:780;letter-spacing:-.045em;color:#174246;line-height:1;white-space:nowrap;transform:translateY(.5px)}.cell.three .number{font-size:clamp(15px,4.5vw,24px)}.cell.absent .number{display:none}.cell.hit{animation:tilepulse .27s var(--ease)}@keyframes tilepulse{0%{filter:brightness(1);transform:scale(1)}40%{filter:brightness(1.12);transform:scale(.88)}100%{filter:brightness(1);transform:scale(1)}}.cell.vanish{animation:cellgone .24s ease-out forwards}@keyframes cellgone{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.42)}}.cell.hit:after{content:"";position:absolute;inset:-3px;border-radius:13px;pointer-events:none;border:1px solid #60dabf;opacity:.65;animation:edgeflash .3s ease-out}@keyframes edgeflash{to{opacity:0;transform:scale(1.12)}}.board .beam{position:absolute;left:0;top:0;z-index:5;pointer-events:none;opacity:0;border-radius:40px;background:linear-gradient(90deg,#a4fff4,#36cebc 50%,#e9fffa);box-shadow:0 0 8px #31e1c3,0 0 26px #3de4bc85}.board .beam.horizontal{height:3px;width:100%;transform:scaleX(0);transform-origin:left}.board .beam.vertical{width:3px;height:100%;transform:scaleY(0);transform-origin:top}.board .beam.fire-horizontal{animation:shootH .41s ease-out forwards}.board .beam.fire-vertical{animation:shootV .41s ease-out forwards}@keyframes shootH{0%{opacity:1;transform:scaleX(0)}58%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(1)}}@keyframes shootV{0%{opacity:1;transform:scaleY(0)}58%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}.board.rejoice{animation:boardglow .65s ease-out}@keyframes boardglow{40%{box-shadow:inset 0 0 0 2px #86efd4,inset 0 0 35px #57e8ae38}100%{box-shadow:inset 0 6px 17px #091e2538}}.board .float{position:absolute;z-index:6;color:#c5fff3;font-weight:850;font-size:13px;pointer-events:none;animation:floaty .62s ease-out forwards;text-shadow:0 1px 5px #112e32}@keyframes floaty{0%{opacity:0;transform:translate(-50%,0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}.shots{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:0 2px}.shots-note{font-size:10px;color:#849b92;letter-spacing:.06em;font-weight:800}.shots-status{font-size:12px;color:#82978e;font-weight:760}.shots-status b{color:#0a8f85;font-size:21px;letter-spacing:-.03em}
.dock{margin:16px 5px 0}.dock-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}.dock-title{font-weight:850;font-size:13px;letter-spacing:.03em}.dock-desc{color:#8fa69d;font-weight:700;font-size:11px}.primes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.prime{background:#fffefa;border:1px solid #dfebe2;border-radius:16px;min-height:64px;color:#557970;display:flex;align-items:center;justify-content:center;font-size:29px;letter-spacing:-.03em;font-weight:800;box-shadow:0 4px 0 #d7e5da;transition:transform .13s,background .13s,color .13s,box-shadow .13s}.prime.selected{background:#d9f5ec;border-color:#42bdaa;color:#075b57;box-shadow:0 3px 0 #77c8b5,0 5px 16px #40bba127;transform:translateY(1px)}.prime:active{transform:translateY(4px);box-shadow:none}.control-row{display:flex;justify-content:space-between;align-items:center;padding:17px 8px 0}.text-btn{border:0;background:none;color:#77968b;font-size:12px;font-weight:790;padding:10px 5px}.text-btn:disabled{opacity:.3}.text-btn:active{color:#00a49a}.mini-mark{font-size:9px;color:#a5b5ac;letter-spacing:.12em;font-weight:800}
.sheet{position:fixed;inset:0;background:#0b2428a9;backdrop-filter:blur(9px);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.sheet.open{display:flex}.panel{width:min(370px,100%);background:#fffef9;border-radius:27px;padding:28px 22px 23px;text-align:center;box-shadow:0 22px 60px #071c2242}.panel .symbol{font-size:38px;color:#0aa597;font-weight:820}.panel h2{font-size:24px;letter-spacing:-.05em;margin:12px 0 9px}.panel p{font-size:13px;color:#738d82;line-height:1.75;margin:0 0 20px}.panel button{min-height:52px;background:#0c9b8f;color:white;border:0;width:100%;border-radius:15px;font-size:15px;font-weight:830;box-shadow:0 4px 0 #0b776e}.panel button:active{transform:translateY(3px);box-shadow:none}.panel .secondary{margin-top:11px;background:transparent;border:1px solid #dce9e1;color:#75948a;box-shadow:none;min-height:43px}
@media(max-width:370px){.app{padding:9px 6px max(13px,env(safe-area-inset-bottom))}.arena{grid-template-columns:34px minmax(0,1fr);grid-template-rows:31px auto}.arena-card{padding:8px 5px}.cells{gap:3px;inset:3px}.cell{border-radius:7px}.prime{min-height:58px;font-size:25px}.instruction{height:38px}.dock{margin-top:12px}.brand h1{font-size:25px}}
@media(max-height:690px){.app{padding-top:6px}.stage-line{padding-top:8px}.stage-progress{margin-top:5px}.instruction{height:31px}.arena-card{padding-top:7px;padding-bottom:5px}.arena{grid-template-columns:38px minmax(0,1fr);grid-template-rows:30px auto}.shots{margin-top:4px}.dock{margin-top:8px}.dock-header{margin-bottom:6px}.prime{min-height:52px}.control-row{padding-top:4px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="app">
<header class="head"><div class="brand"><small>A NUMBER PUZZLE EXPERIMENT</small><h1>PRIME <em>RAY</em></h1></div><div class="head-actions"><button class="round" id="sound" aria-label="音をオン・オフ">♫</button><button class="round" id="help" aria-label="ルールを見る">?</button></div></header>
<div class="stage-line"><div><span class="stage-label">STAGE <b id="stageNo">01 / 10</b></span><div class="stage-progress" id="progress"></div></div><div class="stats"><span id="clearCount">0 / 0</span> <span>消去</span></div></div>
<div class="instruction" id="instruction">数字のビームを選んで、<b>行か列</b>を撃とう</div>
<section class="arena-card" aria-label="数字ターゲットとビーム発射口"><div class="arena"><div class="corner">↓ →</div><div class="col-aim" id="colAim"></div><div class="row-aim" id="rowAim"></div><div class="board" id="board"><div class="cells" id="cells"></div><div class="beam" id="beam"></div></div></div><div class="shots"><span class="shots-note">ALL TARGETS → 1 → CLEAR</span><span class="shots-status">あと <b id="shotsLeft">3</b> 発</span></div></section>
<section class="dock"><div class="dock-header"><span class="dock-title">ビームの数字</span><span class="dock-desc">2・3・5・7で割れる的だけ反応</span></div><div class="primes" id="primeDock"></div></section>
<div class="control-row"><button class="text-btn" id="undo">↶ ひとつ戻す</button><span class="mini-mark">FACTOR LAB / PROTOTYPE</span><button class="text-btn" id="retry">↻ やりなおす</button></div>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-live="polite"><div class="panel"><div class="symbol" id="panelIcon">✦</div><h2 id="panelTitle">クリア！</h2><p id="panelDesc"></p><button id="panelMain">次のステージへ</button><button class="secondary" id="panelAlt">もう一度</button></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const N=5;const PRIMES=[2,3,5,7];
const SPEC=[
 {title:'一発でいくつ割れる？',initial:[[2,2],[2,3],[2,4],[2,0]],budget:3},
 {title:'十字に撃ち抜こう',ops:[['r',2,2],['c',2,3]],seed:2,budget:2},
 {title:'縦横でまとめて消そう',ops:[['r',1,2],['r',3,3],['c',2,2]],seed:3,budget:3},
 {title:'3種類の因数',ops:[['r',2,3],['c',1,5],['c',3,2]],seed:7,budget:3},
 {title:'2回撃つ意味',ops:[['r',0,2],['r',0,2],['c',4,3],['r',3,5]],seed:11,budget:4},
 {title:'7が登場',ops:[['r',4,7],['c',1,3],['c',2,2],['r',2,5]],seed:23,budget:4},
 {title:'交差点が鍵',ops:[['r',1,2],['r',2,2],['c',2,3],['c',3,5],['r',1,3]],seed:19,budget:5},
 {title:'離れた数字も一撃',ops:[['r',0,7],['r',3,2],['c',3,2],['c',0,5],['c',4,3]],seed:5,budget:5},
 {title:'倍の数を見抜く',ops:[['r',1,3],['r',4,7],['c',3,2],['r',1,3],['c',0,5],['c',4,2]],seed:31,budget:6},
 {title:'因数マスター',ops:[['r',0,2],['r',0,3],['r',4,7],['c',1,5],['c',3,2],['c',3,3],['r',2,5]],seed:43,budget:7}
];
function gridFor(stage){const spec=SPEC[stage];if(spec.initial){const g=Array.from({length:25},()=>0);g[10]=2;g[11]=4;g[12]=6;return g;}
 const ops=spec.ops;const g=Array.from({length:25},()=>1);
 for(const [axis,i,p] of ops)for(let r=0;r<N;r++)for(let c=0;c<N;c++)if((axis==='r'?r:c)===i)g[r*N+c]*=p;
 // Thin out targets away from intersections for a quieter, more legible board.
 let state=spec.seed*15571;const random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296};
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){
   const k=r*N+c;const multiplicity=ops.filter(([a,i])=>(a==='r'?r:c)===i).length;
   if(multiplicity===0){g[k]=0;continue;}
   if(multiplicity===1&&random()<.24)g[k]=0;
 }
 return g.map(v=>v===1?0:v);
}
let stage=0, numbers=[],budget=0,selected=2,history=[],shotBusy=false,activeSound=true,ctx=null,winCount=0,targets=0;
const elements=[],rowButtons=[],colButtons=[];
const panel=$('sheet'),instructions=$('instruction'),board=$('board');
let playToken=0;
const divisorGcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a;};
const pName=p=>String(p);
function setHint(t){instructions.innerHTML=t;instructions.classList.add('pop');setTimeout(()=>instructions.classList.remove('pop'),270)}
function setup(){const cells=$('cells');for(let i=0;i<25;i++){const e=document.createElement('div');e.className='cell';e.dataset.index=i;e.innerHTML='<span class="number"></span>';elements.push(e);cells.append(e);}for(let i=0;i<5;i++){
 let c=document.createElement('button');c.className='aim';c.type='button';c.textContent='↓';c.setAttribute('aria-label',`${i+1}列をビームで撃つ`);c.addEventListener('click',()=>fire('c',i));$('colAim').append(c);colButtons.push(c);
 let r=document.createElement('button');r.className='aim';r.type='button';r.textContent='➜';r.setAttribute('aria-label',`${i+1}行をビームで撃つ`);r.addEventListener('click',()=>fire('r',i));$('rowAim').append(r);rowButtons.push(r);
 }for(const p of PRIMES){let el=document.createElement('button');el.className='prime';el.type='button';el.dataset.prime=p;el.textContent=p;el.addEventListener('click',()=>{if(shotBusy)return;selected=p;softClick(.65);updatePrime();setHint(`<b>${p}</b>で割れる的を探して、端の矢印を押そう`)});$('primeDock').append(el);}try{activeSound=localStorage.getItem('prime-ray-sound')!=='off';winCount=Number(localStorage.getItem('prime-ray-unlocked'))||0;}catch(e){} $('sound').onclick=()=>{activeSound=!activeSound;try{localStorage.setItem('prime-ray-sound',activeSound?'on':'off')}catch(e){}updateSound();softClick(.5)};$('help').onclick=help;$('retry').onclick=()=>{if(!shotBusy)start(stage)};$('undo').onclick=undo;$('panelAlt').onclick=()=>{closePanel();start(stage)};updateSound();start(stage);}
function updateSound(){$('sound').textContent=activeSound?'♪':'♪̸';$('sound').style.opacity=activeSound?'1':'.42'}
function audio(){if(!activeSound)return null;try{if(!ctx){const A=window.AudioContext||window.webkitAudioContext;ctx=new A()}if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function softClick(volume=.5){const a=audio();if(!a)return;const t=a.currentTime;const len=Math.floor(a.sampleRate*.032),buf=a.createBuffer(1,len,a.sampleRate),arr=buf.getChannelData(0);let z=13;for(let i=0;i<len;i++){z=(Math.imul(z,1664525)+1013904223)>>>0;arr[i]=((z/2147483648)-1)*Math.exp(-i/a.sampleRate*145)*.43;}const src=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.setValueAtTime(1700,t);gain.gain.setValueAtTime(.11*volume,t);src.connect(filter).connect(gain).connect(a.destination);src.start();src.stop(t+.037)}
function beamSound(hits){const a=audio();if(!a)return;const t=a.currentTime;const duration=.16;const len=Math.floor(a.sampleRate*duration),buf=a.createBuffer(1,len,a.sampleRate),ar=buf.getChannelData(0);let z=37,low=0;for(let i=0;i<len;i++){z=(Math.imul(z,1664525)+1013904223)>>>0;const raw=z/2147483648-1;low=low*.945+raw*.055;ar[i]=low*Math.sin(Math.PI*i/len)*.3}const src=a.createBufferSource(),gain=a.createGain(),filter=a.createBiquadFilter();src.buffer=buf;filter.type='lowpass';filter.frequency.value=2500;gain.gain.setValueAtTime(.18,t);src.connect(filter).connect(gain).connect(a.destination);src.start();src.stop(t+duration+.004)}
function clearSound(){const a=audio();if(!a)return;const t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(392,t);o.frequency.exponentialRampToValueAtTime(330,t+.2);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.012);g.gain.exponentialRampToValueAtTime(.0002,t+.22);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.23)}
function updatePrime(){document.querySelectorAll('.prime').forEach(btn=>{const active=Number(btn.dataset.prime)===selected;btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',String(active))});}
function paint(){let count=0;for(let i=0;i<25;i++){const v=numbers[i];const e=elements[i];e.querySelector('.number').textContent=v||'';e.classList.toggle('occupied',v>1);e.classList.toggle('absent',!v);e.classList.toggle('three',v>=100);if(v>1)count++;} $('clearCount').textContent=`${targets-count} / ${targets}`;$('shotsLeft').textContent=budget;$('undo').disabled=history.length===0||shotBusy;document.querySelectorAll('.aim').forEach(b=>b.disabled=shotBusy);}
function showProgress(){ $('stageNo').textContent=String(stage+1).padStart(2,'0')+' / '+String(SPEC.length).padStart(2,'0');$('progress').innerHTML=SPEC.map((_,i)=>`<span class="progress-dot ${i<stage?'done':i===stage?'active':''}"></span>`).join('')}
function start(k){playToken++;stage=k;history=[];shotBusy=false;selected=2;numbers=gridFor(stage);targets=numbers.filter(v=>v>1).length;budget=SPEC[stage].budget;panel.classList.remove('open');board.classList.remove('rejoice');showProgress();updatePrime();setHint(SPEC[stage].title);paint();}
function floatText(index,txt){const x=(index%N+.5)/N*100,y=(Math.floor(index/N)+.4)/N*100;const e=document.createElement('div');e.className='float';e.textContent=txt;e.style.left=`${x}%`;e.style.top=`${y}%`;board.append(e);setTimeout(()=>e.remove(),680)}
function drawBeam(axis,rowcol){const e=$('beam');e.className='beam '+(axis==='r'?'horizontal':'vertical');if(axis==='r'){e.style.top=((rowcol+.5)*20)+'%';e.style.left=0;}else{e.style.left=((rowcol+.5)*20)+'%';e.style.top=0;}void e.offsetWidth;e.classList.add(axis==='r'?'fire-horizontal':'fire-vertical');}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function fire(axis,i){if(shotBusy||panel.classList.contains('open')||budget<=0)return;const hits=[];for(let n=0;n<25;n++){const r=Math.floor(n/N),c=n%N;if((axis==='r'?r:c)===i&&numbers[n]>1&&numbers[n]%selected===0)hits.push(n);}if(hits.length===0){softClick(.26);setHint(`この線には <b>${selected}</b>で割れる的がないよ`);return;}
 const token=playToken;history.push({numbers:[...numbers],budget,selected});shotBusy=true;paint();drawBeam(axis,i);beamSound(hits.length);await delay(135);if(token!==playToken)return;
 for(const n of hits){const before=numbers[n];numbers[n]=before/selected;const e=elements[n];e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit');floatText(n,numbers[n]===1?'CLEAR':String(before)+'→'+String(numbers[n]));if(numbers[n]===1)e.classList.add('vanish');}
 budget--;paint();setHint(hits.length>=3?`<b>${hits.length} HIT!</b> 一発でまとめて割った！`:`<b>${selected}</b>のビームで${hits.length}個を割った！`);
 await delay(340);if(token!==playToken)return;elements.forEach(e=>e.classList.remove('hit','vanish'));paint();shotBusy=false;paint();if(numbers.every(x=>x<=1)){winCount=Math.max(winCount,stage+1);try{localStorage.setItem('prime-ray-unlocked',String(winCount))}catch(e){}board.classList.add('rejoice');clearSound();await delay(350);if(token!==playToken)return;showPanel('win');}else if(budget===0){await delay(350);if(token!==playToken)return;showPanel('fail');}}
function undo(){if(shotBusy||history.length===0||panel.classList.contains('open'))return;playToken++;const prev=history.pop();numbers=[...prev.numbers];budget=prev.budget;selected=prev.selected;elements.forEach(e=>e.classList.remove('hit','vanish'));updatePrime();paint();softClick(.45);setHint('ひとつ前の盤面に戻したよ')}
function showPanel(type){panel.classList.add('open');const win=type==='win';$('panelIcon').textContent=win?'✦':'↶';$('panelTitle').textContent=win?'きれいに消えた！':'あと少し！';$('panelDesc').innerHTML=win?`<b>${targets}個</b>のターゲットを、<b>${SPEC[stage].budget-budget}発</b>のビームでクリア。<br>どこに撃てばたくさん割れるか、見えてきたかな？`:'今のビームを使う順番を変えると、もっとたくさん消せるかも。';$('panelMain').textContent=win?'次のステージへ':'もう一度';$('panelMain').onclick=()=>{closePanel();start(win?Math.min(stage+1,SPEC.length-1):stage)};$('panelAlt').textContent=win?'同じステージで遊ぶ':'盤面に戻る';$('panelAlt').onclick=()=>{closePanel();if(win)start(stage)};}
function closePanel(){panel.classList.remove('open')}
function help(){panel.classList.add('open');$('panelIcon').textContent='2 ÷';$('panelTitle').textContent='あそびかた';$('panelDesc').innerHTML='下で <b>2・3・5・7</b> のビームを選び、盤面の <b>上か左の矢印</b> を押す。<br>その行・列にある数字のうち、ビームの数字で割れるものだけが <b>1回割れる</b>。<br>1になった的は消える。全部の的を消せばクリア！';$('panelMain').textContent='遊んでみる';$('panelMain').onclick=closePanel;$('panelAlt').textContent='閉じる';$('panelAlt').onclick=closePanel;}
setup();window.__primeRayTest={getState:()=>({stage,numbers:[...numbers],budget,selected,targets,shotBusy}),fire,choose:p=>{selected=p;updatePrime()},start,gridFor,undo};
})();
