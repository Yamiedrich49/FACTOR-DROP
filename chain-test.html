/* FACTOR DROP — tactile edition: a quiet surface and precise, manufactured numbers */
:root{--bg:#f6f6f0;--ink:#183538;--soft:#728b84;--quiet:#99aaa1;--cyan:#168e84;--cyan-dark:#08766c;--edge:#e0e7de;--slate:#183439;--slate2:#122a30;--tile:#fffdf7;--pad:3.5px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{background:radial-gradient(ellipse 130% 40% at 50% -17%,#ddeae4 0%,transparent 83%),var(--bg);color:var(--ink)}
.app{max-width:440px;padding-top:max(16px,env(safe-area-inset-top));padding-left:18px;padding-right:18px}

.icon-btn:active{transform:translateY(1px) scale(.975)}

.hud-number small{font-size:10px;font-weight:650;color:#9cafa5}
.hintline{height:25px;margin:0 0 8px 1px;gap:7px;font-size:11px;letter-spacing:-.015em;color:#6e8881;font-weight:620}

.hintline strong{color:#247b72;font-weight:750}

.lane-hilight{background:linear-gradient(180deg,#b0d4bb0c 0%,#c4f3db05 60%,#b1e9c91a);border-color:#afdbce16;transition:transform 90ms cubic-bezier(.2,.74,.28,1)}
.place-inner{background:#c4f2d810;border:1.5px solid #9fe7c6a6;border-radius:8px;opacity:.9;box-shadow:inset 0 0 0 1px #c5fae01f;animation:none}

.tile-number{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Arial Rounded MT Bold", "Helvetica Neue",sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1;font-weight:760;font-size:clamp(19px,5.65vw,27px);letter-spacing:-.065em;color:#244046;line-height:1.04;text-shadow:0 1px 0 #ffffffd9;transform:translateY(.7px)}
.tile-dots{gap:3px;height:4px;margin-top:1px;opacity:.48}.dot{width:3.1px;height:3.1px;box-shadow:none}

.active-block .tile{border:1px solid #acd9bd;background:linear-gradient(155deg,#fffef7,#e9f8ed);box-shadow:0 3px 0 #82b5a4,0 7px 13px #001e2342,inset 0 1px 0 #fff}

.burst-particle{height:3px;width:3px;box-shadow:none;opacity:.7}
.board-bottom{padding:8px 8px 9px;color:#9baea4;font-weight:620;font-size:10px}
.board-bottom b{color:#5c9e8c;font-weight:730}

<body>

<div class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialog-icon" id="dialogIcon">÷</div><h2 id="dialogTitle">あそびかた</h2><div id="dialogText"><p>1以外の公約数を持つ数字をぶつけると、両方が約分されます。</p></div><div class="dialog-actions"><button id="sheetAlt">閉じる</button><button class="main" id="sheetMain">あそぶ</button></div></div></div>
<script>
(()=>{'use strict';
const ROWS=9,COLS=6, $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
const board=$('board'),tilesEl=$('tiles'),activeEl=$('active'),marker=$('marker'),lane=$('lane'),coach=$('coach'),learning=$('learning'),sheet=$('sheet');
const colors={2:'#1ba9a1',3:'#edab69',5:'#9881c6',7:'#d4b657'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const delay=ms=>reduce?1:ms;
const seedCols=()=>[[9],[15],[14],[21],[10],[25]];
const seedQueue=[7,3,5,2,6,14,7,10,3];
const pool=[2,2,3,3,5,5,6,6,7,7,9,10,12,14,15,18,20,21,25,27,28,30,35,42,45,49];
let cols=seedCols(),queue=[],activeCol=2,turns=0,score=0,best=0,auto=true,autoRow=0,lastFrame=0,paused=false,busy=false,ended=false,rng=0x3e41c9a,history=[],soundOn=true,ctx=null,noiseBuf=null,modeGeneration=0;
try{best=Number(localStorage.getItem('factor-drop-best-v1'))||0; soundOn=localStorage.getItem('factor-drop-sound-v1')!=='off';}catch(e){}
const gcd=(a,b)=>{while(b){[a,b]=[b,a%b]}return a};
const primes=n=>{const out=[];for(let p=2;p*p<=n;p++){while(n%p===0){out.push(p);n/=p;}}if(n>1)out.push(n);return out;};
const dots=n=>primes(n).map(p=>`<i class="dot" style="--d:${colors[p]||'#90a6a1'}"></i>`).join('');
const numTile=(n)=>`<div class="tile"><div class="tile-number">${n}</div></div>`;
function rand(){rng=(Math.imul(1664525,rng)+1013904223)>>>0;return rng/4294967296;}
function pick(){let tops=cols.map(x=>x.at(-1)).filter(Boolean),matches=pool.filter(n=>tops.some(top=>gcd(top,n)>1));let list=(tops.length&&rand()<.78&&matches.length)?matches:pool;return list[Math.floor(rand()*list.length)];}
function ensureQueue(){while(queue.length<4)queue.push(pick());}
function saveBest(){if(score>best){best=score;try{localStorage.setItem('factor-drop-best-v1',best)}catch(e){}}}

// A quiet, percussive sound system. No sawtooth synths, dissonant chords or endless ringing.
// Samples are pre-rendered once and replayed as precisely timed gestures.
let soundBank=null, soundMaster=null, lastTickTime=0;
function audio(){
 if(!soundOn)return null;
 try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  if(!soundMaster){
   const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-18;limiter.knee.value=12;limiter.ratio.value=3.5;limiter.attack.value=.002;limiter.release.value=.11;
   soundMaster=ctx.createGain();soundMaster.gain.value=.64;
   soundMaster.connect(limiter).connect(ctx.destination);
   soundBank=createSoundBank(ctx);
  }
  return ctx;
 }catch(e){return null;}
}
function createSoundBank(c){
 const rate=c.sampleRate;
 // Deterministic white noise, softened by multiple-pole low-pass (no digital hiss / clipping).
 function create(name, duration, component){
  const size=Math.ceil(rate*duration),buffer=c.createBuffer(1,size,rate),p=buffer.getChannelData(0);
  let seed=21771,lo=0,lo2=0;
  for(let i=0;i<size;i++){
   const t=i/rate;
   seed=(Math.imul(seed,1664525)+1013904223)>>>0;
   const white=seed/2147483648-1;
   lo+=.12*(white-lo);lo2+=.24*(lo-lo2);
   p[i]=Math.tanh(component(t,white,lo,lo2)*1.15);
  }
  // Remove any initial discontinuity; fade the tail to exact silence.
  for(let i=0;i<Math.min(96,size);i++)p[i]*=i/96;
  for(let i=0;i<Math.min(300,size);i++)p[size-1-i]*=i/300;
  return buffer;
 }
 const exp=(t,n)=>Math.exp(-t*n);
 const phase=(hz,t)=>Math.sin(2*Math.PI*hz*t);
 const tap=create('tap',.065,(t,w,a,b)=>
   .085*w*exp(t,530)+.17*b*exp(t,195)+.032*phase(415,t)*exp(t,130));
 const move=create('move',.051,(t,w,a,b)=>
   .065*w*exp(t,650)+.12*b*exp(t,245)+.02*phase(680,t)*exp(t,205));
 const land=create('land',.14,(t,w,a,b)=>
   .14*w*exp(t,480)+.31*b*exp(t,135)+.19*phase(218,t)*exp(t,37)+.07*phase(436,t)*exp(t,72));
 const split=create('split',.23,(t,w,a,b)=>
   .10*b*exp(t,125)+.16*phase(523.25,t)*exp(t,21)+.055*phase(1046.5,t)*exp(t,33));
 const success=create('success',.37,(t,w,a,b)=>
   .11*phase(523.25,t)*exp(t,11)+ (t>.087?.11*phase(783.99,t-.087)*exp((t-.087)*15):0));
 const undo=create('undo',.075,(t,w,a,b)=>.09*b*exp(t,150)+.06*phase(270,t)*exp(t,80));
 return {tap,move,land,split,success,undo};
}
function playSample(name, volume=1, pitch=1){
 const c=audio();if(!c||!soundBank?.[name])return;
 const src=c.createBufferSource(),gain=c.createGain();
 src.buffer=soundBank[name];src.playbackRate.value=pitch;
 gain.gain.value=Math.min(1,Math.max(0,volume));
 src.connect(gain).connect(soundMaster);
 try{src.start(c.currentTime+.001)}catch(e){}
 src.onended=()=>{src.disconnect();gain.disconnect();};
}
function clickSound(strength=.6){playSample('tap',Math.min(.72,strength*.72));}
function tick(){const now=performance.now();if(now-lastTickTime<58)return;lastTickTime=now;playSample('move',.39);}
function dropSound(){playSample('land',.73);}
function divideSound(k=1){playSample('split',.72,Math.pow(2,Math.min(k-1,4)/24));}
function finishSound(){playSample('success',.48);}
function tileKey(c,index){return `${c}-${index}`}
let previousShown=new Map(),flashIds=new Set(),lastScoreDisplayed=null;
let visibleTileNodes=new Map();
function renderBoard(){const next=new Map(),newValues=new Map();
 for(let c=0;c<COLS;c++)for(let i=0;i<cols[c].length;i++){
  const row=ROWS-1-i,n=cols[c][i],key=tileKey(c,i),prev=previousShown.get(key);
  let node=visibleTileNodes.get(key);
  if(!node){node=document.createElement('div');node.className='tile-wrap appear';node.style.left=`${c/6*100}%`;node.style.top=`${row/9*100}%`;node.innerHTML=numTile(n);tilesEl.appendChild(node)}
  else {node.style.top=`${row/9*100}%`;if(prev!==n){node.innerHTML=numTile(n);node.classList.remove('flare','appear');void node.offsetWidth;node.classList.add('flare')}else if(flashIds.has(key)){node.classList.remove('flare','appear');void node.offsetWidth;node.classList.add('flare')}else{node.classList.remove('flare','appear')}}
  next.set(key,node);newValues.set(key,n);
 }
 for(let [key,node] of visibleTileNodes){if(!next.has(key))node.remove()}
 visibleTileNodes=next;previousShown=newValues;flashIds.clear();
}
function moveActive(immediate=false){const n=queue[0]||7;if(activeEl.dataset.num!==String(n)){activeEl.innerHTML=numTile(n);activeEl.dataset.num=String(n)}activeEl.style.left=`${activeCol/6*100}%`;activeEl.style.top='0';const y=(auto?autoRow:-.02);activeEl.style.transform=`translateY(${y*100}%)`;activeEl.style.opacity=busy||ended?'0':'1';activeEl.classList.toggle('drop',auto);lane.style.transform=`translateX(${activeCol*100}%)`;const height=cols[activeCol].length;let target=ROWS-1-height;if(target<0)target=0;marker.style.left=`${activeCol/6*100}%`;marker.style.top=`${target/9*100}%`;marker.style.opacity=(height>=ROWS||busy||ended)?'0':'.83';if(immediate){lane.style.transition='none';marker.style.transition='none';requestAnimationFrame(()=>{lane.style.transition='';marker.style.transition=''})}}
function renderInfo(){saveBest();if(lastScoreDisplayed!==null&&score!==lastScoreDisplayed){const el=$('score');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}lastScoreDisplayed=score;$('score').textContent=String(score).padStart(3,'0');$('best').textContent=String(best).padStart(3,'0');$('moves').textContent=turns;$('nextNum').textContent=queue[0];$('peek').innerHTML=queue.slice(1,4).map(n=>`<span class="peek-box">${n}</span>`).join('');$('undoBtn').disabled=busy||!history.length;$('dropBtn').disabled=busy||ended;$('leftBtn').disabled=busy||ended;$('rightBtn').disabled=busy||ended;$('soundBtn').setAttribute('aria-pressed',String(soundOn));$('soundSvg').innerHTML=soundOn?'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>':'<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6m0-6-5 6"/>';moveActive()}
function setCoach(html){$('coachCopy').innerHTML=html}
function setLearn(html,highlight=false){$('learnText').innerHTML=html;learning.classList.toggle('active',highlight)}
function flash(c,i){flashIds.add(tileKey(c,i))}
function floatText(c,row,html){const e=document.createElement('div');e.className='spark';e.style.left=`${(c+.5)/6*100}%`;e.style.top=`${(row+.15)/9*100}%`;e.textContent=html;board.appendChild(e);setTimeout(()=>e.remove(),720)}
function clone(){return {cols:cols.map(a=>a.slice()),queue:queue.slice(),turns,score,rng,activeCol,autoRow}}
function reset(){auto=true;board.querySelectorAll('.active-block.drop,.spark,.burst-particle').forEach(el=>{if(el!==activeEl)el.remove()});modeGeneration++;cols=seedCols();queue=seedQueue.slice();ensureQueue();turns=0;score=0;activeCol=2;autoRow=0;ended=false;busy=false;history=[];previousShown.clear();flashIds.clear();tilesEl.innerHTML='';visibleTileNodes.clear();setCoach('まずは <strong>7</strong> を <strong>14</strong> に落としてみよう。');setLearn('1以外の公約数があれば、<strong>両方を割る</strong>。1になった数字だけ消える。');renderBoard();renderInfo();closeSheet();}
function restore(s){cols=s.cols.map(a=>a.slice());queue=s.queue.slice();turns=s.turns;score=s.score;rng=s.rng;activeCol=s.activeCol;autoRow=s.autoRow;ended=false;previousShown.clear();tilesEl.innerHTML='';visibleTileNodes.clear();setCoach('さあ、どの数字に落とす？');setLearn('約分すると数字が小さくなり、<strong>1だけが消える</strong>。');ensureQueue();renderBoard();renderInfo()}
function factorDust(c,row,d){if(reduce)return;const prime=primes(d)[0]||2,color=colors[prime]||'#9bc4b3';const w=board.clientWidth,h=board.clientHeight;
  const centerX=(c+.5)*w/COLS,centerY=(row+.6)*h/ROWS;
  for(let i=0;i<4;i++){const a=(Math.PI*2/4)*i+(Math.PI/9),radius=12+(i%3)*6;const p=document.createElement('i');p.className='burst-particle';p.style.left=`${centerX}px`;p.style.top=`${centerY}px`;p.style.setProperty('--dust',i%3===0?'#fffaf0':color);p.style.setProperty('--dx',`${Math.cos(a)*radius}px`);p.style.setProperty('--dy',`${Math.sin(a)*radius-13}px`);board.appendChild(p);setTimeout(()=>p.remove(),510)}
}
function centerCol(c){return (c+.5)/6}
function buildDropEl(n,c,startRow,targetRow){const e=document.createElement('div');e.className='active-block drop';e.innerHTML=numTile(n);e.style.left=`${c/6*100}%`;e.style.top='0';e.style.transition='none';e.style.transform=`translateY(${startRow*100}%)`;board.append(e);requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transition=`transform ${delay(Math.max(155,Math.min(620,(targetRow-startRow)*55+160)))}ms cubic-bezier(.19,.78,.26,1)`;e.style.transform=`translateY(${targetRow*100}%)`;}));return e;}
async function dropAt(c){if(busy||ended||sheet.classList.contains('open'))return;if(c<0||c>=COLS)return;
 const gen=modeGeneration;if(cols[c].length>=ROWS){setCoach('そこはもういっぱい。<strong>別の列</strong>を選ぼう。');clickSound(.22);return;}
 busy=true;const n=queue[0],startRow=auto?autoRow:0,targetRow=ROWS-1-cols[c].length,travel=delay(Math.max(155,Math.min(620,(targetRow-startRow)*55+160)));
 history.push(clone());if(history.length>30)history.shift();activeCol=c;activeEl.style.opacity='0';marker.style.opacity='0';const falling=buildDropEl(n,c,startRow,targetRow);clickSound(.34);await wait(travel+26);if(gen!==modeGeneration){falling.remove();return;}falling.remove();dropSound();
 const a=cols[c],before=a.length? a.at(-1):null;let chain=0;let math=[];
 if(before!==null&&gcd(before,n)>1){const d=gcd(before,n),qIncoming=n/d,qExisting=before/d;
 chain++;math.push({incoming:n,existing:before,d,qi:qIncoming,qe:qExisting});a.pop();if(qExisting>1)a.push(qExisting);if(qIncoming>1)a.push(qIncoming);if(qExisting>1)flash(c,a.length-(qIncoming>1?2:1));if(qIncoming>1)flash(c,a.length-1);
 floatText(c,targetRow,`÷ ${d}`);factorDust(c,targetRow,d);divideSound(chain);renderBoard();await wait(delay(320));if(gen!==modeGeneration)return;
 // The newly exposed/changed top tile may now react with the tile directly below it.
 for(let guard=0;guard<ROWS&&a.length>=2;guard++){
  const top=a.at(-1),lower=a.at(-2),dd=gcd(top,lower);if(dd<=1)break;
  chain++;const qt=top/dd,ql=lower/dd;math.push({incoming:top,existing:lower,d:dd,qi:qt,qe:ql});a.pop();a.pop();if(ql>1)a.push(ql);if(qt>1)a.push(qt);flash(c,a.length-1);floatText(c,ROWS-1-a.length,`÷ ${dd}`);factorDust(c,ROWS-1-a.length,dd);divideSound(chain);renderBoard();await wait(delay(295));if(gen!==modeGeneration)return;
 }
 }else{a.push(n);flash(c,a.length-1);renderBoard();await wait(delay(135));if(gen!==modeGeneration)return;}

 // EXPERIMENT: An activated number may reduce an adjacent number, too.
 // Once a tile changes, it becomes the frontier of a short, visible chain.
 // Prioritize below, then left/right, then above; never sweep the untouched board.
 let frontier=[];
 if(chain)for(let i=Math.max(0,cols[c].length-2);i<cols[c].length;i++)frontier.push([c,i]);
 const directions=[[0,-1],[-1,0],[1,0],[0,1]];
 const pushFront=(out,cc,ii)=>{if(cc<0||cc>=COLS||ii<0||ii>=cols[cc].length)return;const k=cc+':'+ii;if(!out.some(v=>v[0]===cc&&v[1]===ii))out.push([cc,ii]);};
 for(let guard=0;guard<36&&frontier.length;guard++){
  let pair=null;
  for(const [cc,ii] of frontier){
   if(ii<0||ii>=cols[cc].length)continue;
   const v=cols[cc][ii];
   for(const [dc,di] of directions){
    const nc=cc+dc,ni=ii+di;
    if(nc<0||nc>=COLS||ni<0||ni>=cols[nc].length)continue;
    const g=gcd(v,cols[nc][ni]);
    if(g>1){pair={cc,ii,nc,ni,g};break;}
   }
   if(pair)break;
  }
  if(!pair)break;
  const {cc,ii,nc,ni,g}=pair;
  const leftVal=cols[cc][ii],rightVal=cols[nc][ni];
  const ql=leftVal/g, qr=rightVal/g;
  math.push({incoming:leftVal,existing:rightVal,d:g,qi:ql,qe:qr});chain++;
  cols[cc][ii]=ql;cols[nc][ni]=qr;
  if(cc===nc){
   // same column, delete highest index first so the lower index stays stable
   if(ii>ni){if(ql===1)cols[cc].splice(ii,1);if(qr===1)cols[nc].splice(ni,1);}
   else {if(qr===1)cols[nc].splice(ni,1);if(ql===1)cols[cc].splice(ii,1);}
  }else{
   if(ql===1)cols[cc].splice(ii,1);
   if(qr===1)cols[nc].splice(ni,1);
  }
  const adjC=(cc+nc)*.5, adjRow=ROWS-1-Math.min(ii,ni);
  floatText(Math.round(adjC),Math.max(0,adjRow),`÷ ${g}`);
  factorDust(cc,Math.max(0,ROWS-1-ii),g);
  divideSound(chain);
  // Follow the changed numbers and any tiles that fell into their vacated places.
  const next=[];
  // Only changed blocks (or a newly fallen replacement) can propagate.
  pushFront(next,cc,ii);
  pushFront(next,nc,ni);
  frontier=next;
  renderBoard();
  await wait(delay(260));if(gen!==modeGeneration)return;
 }
 turns++;let gained=chain?math.reduce((s,p,i)=>s+(p.d*8+((p.qi===1)?15:0)+((p.qe===1)?15:0))*(i+1),0):5;score+=gained;
 if(math.length){const first=math[0],inTxt=first.qi===1?'1 → 消える':String(first.qi),exTxt=first.qe===1?'1 → 消える':String(first.qe);setLearn(`<strong>${first.incoming} ÷ ${first.d} → ${inTxt}</strong>　·　<strong>${first.existing} ÷ ${first.d} → ${exTxt}</strong>`,true);if(chain>1){setCoach(`<strong>${chain}連鎖！</strong> 横にもつながった！`);finishSound();}else setCoach(`<strong>${first.incoming} ÷ ${first.d} → ${first.qi===1?'消える':first.qi}</strong>　·　<strong>${first.existing} ÷ ${first.d} → ${first.qe===1?'消える':first.qe}</strong>`);}
 else if(before!==null){setLearn(`<strong>${n}</strong> と <strong>${before}</strong> は共通因数なし。`,false);setCoach('次はどこに落とす？');}
 else {setLearn(`${n} を置いた。数字をぶつけて、盤面を整理しよう。`,false);setCoach('次の数字を選んで落とそう。');}
 queue.shift();ensureQueue();autoRow=0;busy=false;
 if(cols.some(arr=>arr.length>=ROWS)){ended=true;setCoach('盤面がいっぱい！ ここまでよく遊んだね。');renderInfo();await wait(delay(500));if(gen!==modeGeneration)return;showGameOver();return;}
 renderInfo();
 }
function setCol(c,feedback=true){if(busy||ended)return;c=Math.max(0,Math.min(COLS-1,c));if(c!==activeCol){activeCol=c;if(feedback)tick();moveActive()}}
function showDialog(icon,title,html,alt,main,onAlt,onMain){paused=true;sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');$('dialogIcon').textContent=icon;$('dialogTitle').textContent=title;$('dialogText').innerHTML=html;$('sheetAlt').textContent=alt;$('sheetMain').textContent=main;$('sheetAlt').onclick=()=>{closeSheet();onAlt&&onAlt()};$('sheetMain').onclick=()=>{closeSheet();onMain&&onMain()};}
function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');paused=false;lastFrame=performance.now()}
function showHelp(){showDialog('7÷','あそびかた',`<p>上から来る数字を、好きな列に落とそう。<br><strong>同じ約数</strong>で割れると、両方の数字が小さくなるよ。<br><strong>1</strong>になったブロックだけ消える。</p><div class="rule-example"><span class="rule-tile">7</span><span class="rule-arrow">＋</span><span class="rule-tile">14</span><span class="rule-arrow">→</span><span class="rule-tile">2</span></div><p>音は乾いたクリックと柔らかい着地音。音量を控えめにしているよ。</p><p>数字が小さくなると、その数字が<strong>隣の数字</strong>とも反応して連鎖するよ！</p><p>数字は自動で落ちてくるよ。左右へ動かし、落とすボタンで早く落とせる。横の連鎖もねらってみよう！</p>`,'閉じる','遊んでみる');}
function showGameOver(){showDialog('✦','また挑戦しよう',`<p><strong>${turns}手</strong> 生き残ったよ。<br>スコア <strong>${score}</strong> ／ ベスト <strong>${best}</strong><br>割り算が自然に見えてきたかな？</p>`,'盤面を見る','もう一回',null,reset);}
function beginNew(){if(turns===0){reset();return}showDialog('↻','はじめから遊ぶ？',`<p>いまの盤面はリセットされるよ。<br>ベストスコアは残るから安心してね。</p>`,'つづける','やりなおす',null,reset)}

function animate(ts){if(!lastFrame)lastFrame=ts;const dt=Math.max(0,Math.min(.06,(ts-lastFrame)/1000));lastFrame=ts;if(auto&&!paused&&!busy&&!ended){autoRow+=(.94+Math.min(1.55,turns*.042))*dt;const maxRow=ROWS-1-cols[activeCol].length;if(autoRow>=maxRow){autoRow=Math.max(0,maxRow);dropAt(activeCol)}else moveActive()}requestAnimationFrame(animate)}
const slots=$('slots');for(let i=0;i<ROWS*COLS;i++){const d=document.createElement('div');d.className='slot';slots.appendChild(d)}
let pointerId=null,downX=0,downY=0,dragged=false;
function getPointerCol(e){const r=board.getBoundingClientRect();return Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-r.left)/r.width*COLS)))}
board.addEventListener('pointerdown',e=>{if(busy||ended||sheet.classList.contains('open'))return;board.classList.add('is-aiming');pointerId=e.pointerId;dragged=false;downX=e.clientX;downY=e.clientY;setCol(getPointerCol(e));board.setPointerCapture(e.pointerId);});
board.addEventListener('pointermove',e=>{if(pointerId!==e.pointerId)return;if(Math.abs(e.clientX-downX)>5||Math.abs(e.clientY-downY)>5)dragged=true;setCol(getPointerCol(e));});
board.addEventListener('pointerup',e=>{if(pointerId!==e.pointerId)return;pointerId=null;board.classList.remove('is-aiming');dropAt(activeCol);});
board.addEventListener('pointercancel',()=>{pointerId=null;board.classList.remove('is-aiming')});
$('leftBtn').addEventListener('click',()=>setCol(activeCol-1));$('rightBtn').addEventListener('click',()=>setCol(activeCol+1));$('dropBtn').addEventListener('click',()=>dropAt(activeCol));
$('undoBtn').addEventListener('click',()=>{if(busy||!history.length)return;const s=history.pop();playSample('undo',.72);restore(s)});
$('restartBtn').addEventListener('click',beginNew);
$('helpBtn').addEventListener('click',showHelp);$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem('factor-drop-sound-v1',soundOn?'on':'off')}catch(e){}renderInfo();if(soundOn)clickSound(.55)});
document.addEventListener('keydown',e=>{if(sheet.classList.contains('open')){if(e.key==='Escape')closeSheet();return}if(e.key==='ArrowLeft'){e.preventDefault();setCol(activeCol-1)}else if(e.key==='ArrowRight'){e.preventDefault();setCol(activeCol+1)}else if(e.key===' '||e.key==='ArrowDown'||e.key==='Enter'){e.preventDefault();dropAt(activeCol)}else if(e.key.toLowerCase()==='z'&&(e.ctrlKey||e.metaKey)){$('undoBtn').click()}});
document.addEventListener('visibilitychange',()=>{paused=document.hidden||sheet.classList.contains('open');lastFrame=performance.now()});
queue=seedQueue.slice();ensureQueue();renderBoard();renderInfo();requestAnimationFrame(animate);
window.__factorDropTest={getState:()=>({cols:cols.map(a=>a.slice()),queue:queue.slice(),score,turns,activeCol,busy,ended,auto,autoRow}),gcd,dropAt,reset,setCol};
})();
</script>
</body>
</html>
