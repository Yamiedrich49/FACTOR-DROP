<script>
(()=>{'use strict';

const $=id=>document.getElementById(id); const board=$('board'),nodesEl=$('nodes'),linksEl=$('links'),statusEl=$('status'),modal=$('modal');
let levelIndex=0, vals=[], moves=0, selected=-1, undoStack=[],busy=false, hintMove=null, solved=new Set();
try{const k=JSON.parse(localStorage.getItem('factor-relay-solved-v1')||'[]');solved=new Set(k);}catch(e){}
const pos2=[[24,52],[76,52]],pos3=[[17,53],[50,53],[83,53]],pos4=[[26,28],[74,28],[26,73],[74,73]];

const gcd=(a,b)=>b?gcd(b,a%b):a;
let actx,noiseBank;
function audio(){try{if(!$('audioBtn').dataset.on)return null;actx ||= new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}catch(e){return null}}
function clickSound(kind='tap'){const c=audio();if(!c)return;try{const sr=c.sampleRate, size=Math.ceil(sr*.13);noiseBank ||= (()=>{const buf=c.createBuffer(1,size,sr),data=buf.getChannelData(0);let seed=88331;for(let i=0;i<size;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;data[i]=(seed/2147483648-1)*Math.exp(-i/sr*67)}return buf})();const src=c.createBufferSource();src.buffer=noiseBank;const fil=c.createBiquadFilter();fil.type='bandpass';fil.frequency.value=kind==='success'?950:kind==='move'?1300:1900;fil.Q.value=kind==='move'?.65:.85;const gain=c.createGain(),time=c.currentTime;gain.gain.setValueAtTime(kind==='success'?.17:kind==='move'?.10:.085,time);gain.gain.exponentialRampToValueAtTime(.0001,time+(kind==='success'?.09:kind==='move'?.043:.06));src.connect(fil);fil.connect(gain);gain.connect(c.destination);src.start(time);src.stop(time+.13)}catch(e){}}
$('audioBtn').dataset.on='yes';$('audioBtn').addEventListener('click',()=>{$('audioBtn').dataset.on=$('audioBtn').dataset.on?'':'yes';$('audioBtn').textContent=$('audioBtn').dataset.on?'♫':'♪̸';if($('audioBtn').dataset.on)clickSound()});
function setStatus(txt,tone=''){statusEl.className='status'+(tone?' '+tone:'');statusEl.innerHTML=txt}
function lv(){return LEVELS[levelIndex]}
function edge(a,b){return lv().edges.find(x=>(x[0]===a&&x[1]===b)||(x[1]===a&&x[0]===b))}
function solvedNow(){return vals.every((v,i)=>v===lv().goal[i])}
function load(index){levelIndex=Math.max(0,Math.min(LEVELS.length-1,index));vals=lv().start.slice();moves=0;undoStack=[];selected=-1;busy=false;hintMove=null;modal.classList.remove('show');modal.setAttribute('aria-hidden','true');renderAll();setStatus(levelIndex===0?'まず <b>12</b> をタップして、<b>5</b> に運んでみよう':'タイルをなぞって、目標の数字をつくろう');}
function linksHTML(){const p=positions(vals.length);return lv().edges.map(([a,b,f])=>{const x=(p[a][0]+p[b][0])/2,y=(p[a][1]+p[b][1])/2;return `<line class="link-glow" x1="${p[a][0]}" y1="${p[a][1]}" x2="${p[b][0]}" y2="${p[b][1]}"/><line class="link-path" x1="${p[a][0]}" y1="${p[a][1]}" x2="${p[b][0]}" y2="${p[b][1]}"/><circle class="link-p" cx="${x}" cy="${y}" r="5.3"/><text class="link-number" x="${x}" y="${y+.3}">${f}</text>`}).join('')}
function renderAll(){const s=lv(),p=positions(vals.length);$('eyebrow').textContent=`STAGE ${String(s.id).padStart(2,'0')} / 10`;$('levelTitle').textContent=s.name;$('levelHint').textContent=s.hint;$('par').textContent=s.par;$('prevBtn').disabled=levelIndex===0;$('nextBtn').disabled=levelIndex===LEVELS.length-1;
$('progress').innerHTML=LEVELS.map((l,i)=>`<div class="${solved.has(l.id)?'done':''} ${i===levelIndex?'now':''}"></div>`).join('');linksEl.innerHTML=linksHTML();nodesEl.innerHTML=vals.map((v,i)=>`<button type="button" class="node ${v===s.goal[i]?'match':''} ${selected===i?'selected':''} ${selected>=0&&edge(selected,i)&&vals[selected]%edge(selected,i)[2]===0?'canreceive':''}" style="left:${p[i][0]}%;top:${p[i][1]}%" data-node="${i}" aria-label="いま ${v} 目標 ${s.goal[i]}"><span class="num">${v}</span><span class="target">目標 <strong>${s.goal[i]}</strong></span></button>`).join('');$('moves').textContent=moves;$('matched').textContent=`${vals.filter((v,i)=>v===s.goal[i]).length} / ${vals.length}`;$('undoBtn').disabled=!undoStack.length||busy;}
function updateNodes(){const s=lv();nodesEl.querySelectorAll('.node').forEach(el=>{const i=Number(el.dataset.node);el.classList.toggle('selected',selected===i);el.classList.toggle('canreceive',selected>=0&&!!edge(selected,i)&&vals[selected]%edge(selected,i)[2]===0);});}
function hintFind(){const start=vals.slice(),goal=lv().goal.join(',');const q=[[start,null]], seen=new Set([start.join(',')]);let ptr=0;while(ptr<q.length&&q.length<2500){const [state,first]=q[ptr++];if(state.join(',')===goal)return first;for(const [a,b,p] of lv().edges){for(const [i,j] of [[a,b],[b,a]]){if(state[i]%p!==0||state[j]*p>500)continue;const next=state.slice();next[i]/=p;next[j]*=p;const k=next.join(',');if(seen.has(k))continue;seen.add(k);q.push([next,first||[i,j,p]])}}}return null}
function showHint(){const step=hintFind();if(!step){setStatus('ここからの道が見つからない。<b>もどす</b>で戻ってみよう');return}const [a,b,p]=step;selected=a;hintMove=step;renderAll();const el=nodesEl.querySelector(`[data-node="${a}"]`);el.classList.add('hint');const dest=nodesEl.querySelector(`[data-node="${b}"]`);dest.classList.add('hint');setStatus(`<b>${vals[a]}</b> の中の <b>${p}</b> を、<b>${vals[b]}</b> に渡してみよう`);clickSound('tap')}
async function transfer(a,b){if(busy||a===b)return;const e=edge(a,b);if(!e){selected=b;renderAll();setStatus('線でつながったタイル同士で動かせるよ');clickSound();return}const p=e[2];if(vals[a]%p!==0){selected=a;renderAll();setStatus(`<b>${vals[a]}</b> は <b>${p}</b> で割れないよ`, 'error');clickSound('move');return}if(vals[b]*p>500){setStatus('数字が大きくなりすぎるよ');return}
const before=vals.slice();undoStack.push(before);moves++;selected=-1;hintMove=null;busy=true;clickSound('move');
const pos=positions(vals.length),particle=document.createElement('div');particle.className='transfer';particle.textContent=p;particle.style.left=pos[a][0]+'%';particle.style.top=pos[a][1]+'%';board.appendChild(particle);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));particle.style.left=pos[b][0]+'%';particle.style.top=pos[b][1]+'%';
await new Promise(r=>setTimeout(r,300));vals[a]/=p;vals[b]*=p;particle.classList.add('arrived');setTimeout(()=>particle.remove(),200);busy=false;clickSound('success');renderAll();nodesEl.querySelector(`[data-node="${a}"]`)?.classList.add('bounce');nodesEl.querySelector(`[data-node="${b}"]`)?.classList.add('bounce');setStatus(`${before[a]} ÷ <b>${p}</b> = <b>${vals[a]}</b>　・　${before[b]} × <b>${p}</b> = <b>${vals[b]}</b>`,'good');
if(solvedNow()){solved.add(lv().id);try{localStorage.setItem('factor-relay-solved-v1',JSON.stringify([...solved]))}catch(e){}setTimeout(()=>win(),420)} }
function win(){if(!solvedNow())return;const label=moves===lv().par?'最短手数で完成！':'数字がぜんぶそろった！';$('modalIcon').textContent='✦';$('modalTitle').textContent='ぴったり！';$('modalBody').innerHTML=`${label}<br><b>${moves}手</b> で、すべての数字を目標どおりにできた。<br>数字の中身を動かすと、こんなに変わるんだね。`;$('modalMain').textContent=levelIndex===LEVELS.length-1?'最初から遊ぶ':'次の問題へ';modal.classList.add('show');modal.setAttribute('aria-hidden','false');clickSound('success')}
function help(){modal.classList.add('show');modal.setAttribute('aria-hidden','false');$('modalIcon').textContent='2';$('modalTitle').textContent='数字の中身を運ぼう';$('modalBody').innerHTML='12 には 2 が入っている。<br><b>12 から 2 を取り出すと 6</b>、<b>5 に 2 を渡すと 10</b>。<br>線に書いてある数字を、となりへ１個だけ運ぼう。<br><br>タイルをタップして、隣をタップ。<br>または指でなぞってもOK。';$('modalMain').textContent='わかった！'}
$('modalMain').addEventListener('click',()=>{const t=$('modalTitle').textContent;modal.classList.remove('show');modal.setAttribute('aria-hidden','true');if(t==='ぴったり！')load(levelIndex===LEVELS.length-1?0:levelIndex+1)});$('modalBack').addEventListener('click',()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true')});$('helpBtn').addEventListener('click',help);
$('undoBtn').addEventListener('click',()=>{if(!undoStack.length||busy)return;vals=undoStack.pop();moves=Math.max(0,moves-1);selected=-1;renderAll();setStatus('ひとつ前にもどしたよ');clickSound()});$('resetBtn').addEventListener('click',()=>load(levelIndex));$('hintBtn').addEventListener('click',showHint);$('prevBtn').addEventListener('click',()=>load(levelIndex-1));$('nextBtn').addEventListener('click',()=>load(levelIndex+1));
let pointer=null;
function getHit(x,y){const els=nodesEl.querySelectorAll('.node');for(const el of els){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return Number(el.dataset.node)}return -1}
board.addEventListener('pointerdown',e=>{if(busy||modal.classList.contains('show'))return;const n=getHit(e.clientX,e.clientY);if(n<0)return;pointer={id:e.pointerId,start:n,x:e.clientX,y:e.clientY,drag:false};board.setPointerCapture?.(e.pointerId)});
board.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId||busy)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>16){pointer.drag=true;selected=pointer.start;updateNodes();}});
board.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId||busy)return;const p=pointer;pointer=null;const n=getHit(e.clientX,e.clientY);if(p.drag){if(n>=0&&n!==p.start)transfer(p.start,n);else{selected=p.start;renderAll();setStatus('隣の数字に運んでみよう')}}else{if(n<0)return;if(selected<0||selected===n){selected=selected===n?-1:n;renderAll();if(selected>=0)setStatus('となりのタイルをタップして運ぼう');clickSound()}else transfer(selected,n)}});
board.addEventListener('pointercancel',()=>pointer=null);
window.__relayTest={getState:()=>({levelIndex,vals:vals.slice(),moves,selected,busy}),load,transfer,hintFind};
load(0);
})();
</script></body></html>
